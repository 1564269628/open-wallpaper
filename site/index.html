<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="一个完全托管在 GitHub 上的开放壁纸社区">
  <meta name="color-scheme" content="light dark">
  <title>Open Wallpaper</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./" aria-label="Open Wallpaper 首页">
      <span class="brand-mark" aria-hidden="true">OW</span>
      <span class="brand-copy">
        <strong>Open Wallpaper</strong>
        <small>GitHub 原生壁纸社区</small>
      </span>
    </a>
    <label class="header-search">
      <span aria-hidden="true">⌕</span>
      <input id="searchInput" type="search" placeholder="搜索壁纸、作者或标签" autocomplete="off">
    </label>
    <nav class="top-actions" aria-label="主要操作">
      <button id="themeButton" class="icon-button" type="button" aria-label="切换主题">◐</button>
      <a id="discussionsLink" class="ghost-button" href="#" target="_blank" rel="noreferrer">讨论区</a>
      <a id="submitLink" class="primary-button" href="#" target="_blank" rel="noreferrer">投稿</a>
    </nav>
  </header>

  <main>
    <section class="intro" aria-labelledby="pageTitle">
      <div>
        <p class="eyebrow">DISCOVER · SHARE · OPEN</p>
        <h1 id="pageTitle">发现下一张桌面壁纸</h1>
        <p>浏览无需登录；投稿、审核和评论继续由 GitHub Discussions 承担。</p>
      </div>
      <div class="intro-count" aria-live="polite"><strong id="imageCount">—</strong><span>篇投稿</span></div>
    </section>

    <section class="toolbar" aria-label="筛选和排序">
      <div id="categoryFilters" class="filter-row" aria-label="分类筛选"></div>
      <label class="sort-box">
        <span>排序</span>
        <select id="sortSelect">
          <option value="updated">最近更新</option>
          <option value="newest">最新发布</option>
          <option value="popular">最受欢迎</option>
          <option value="comments">评论最多</option>
        </select>
      </label>
    </section>

    <section aria-live="polite">
      <div id="status" class="status">正在读取公开画廊…</div>
      <div id="gallery" class="gallery" aria-label="壁纸列表"></div>
      <div id="emptyState" class="empty-state" hidden>
        <strong>没有找到匹配的壁纸</strong>
        <span>换个关键词或分类再试试。</span>
      </div>
    </section>
  </main>

  <footer>
    <span>帖子、评论与作者数据来自 GitHub Discussions。</span>
    <a href="https://github.com/1564269628/open-wallpaper" target="_blank" rel="noreferrer">查看源代码 ↗</a>
  </footer>

  <dialog id="viewer" class="viewer" aria-labelledby="viewerTitle">
    <div class="viewer-shell">
      <section class="viewer-media" aria-label="原图预览">
        <button id="closeViewer" class="viewer-close" type="button" aria-label="关闭">×</button>
        <div id="viewerLoading" class="viewer-loading">正在加载原图…</div>
        <img id="viewerImage" alt="">
        <button id="previousImage" class="viewer-nav viewer-prev" type="button" aria-label="上一张">‹</button>
        <button id="nextImage" class="viewer-nav viewer-next" type="button" aria-label="下一张">›</button>
        <div id="viewerDots" class="viewer-dots" aria-label="图片切换"></div>
      </section>

      <aside class="viewer-panel">
        <header class="author-block">
          <img id="viewerAuthorAvatar" class="author-avatar" alt="">
          <div>
            <a id="viewerAuthorLink" href="#" target="_blank" rel="noreferrer"></a>
            <span id="viewerDate"></span>
          </div>
          <a id="openDiscussionTop" class="follow-button" href="#" target="_blank" rel="noreferrer">查看帖子</a>
        </header>

        <div class="viewer-scroll">
          <section class="post-detail">
            <div id="viewerCategory" class="viewer-category"></div>
            <h2 id="viewerTitle"></h2>
            <p id="viewerDescription"></p>
            <div id="viewerTags" class="viewer-tags"></div>
            <div id="viewerStats" class="viewer-stats"></div>
          </section>

          <section class="comments-section" aria-labelledby="commentsTitle">
            <div class="section-heading">
              <h3 id="commentsTitle">评论</h3>
              <span id="viewerCommentSummary"></span>
            </div>
            <div id="viewerComments" class="comment-list"></div>
          </section>
        </div>

        <footer class="viewer-actions">
          <a id="downloadImage" class="ghost-button" href="#" target="_blank" rel="noreferrer">打开原图</a>
          <a id="openDiscussion" class="primary-button" href="#" target="_blank" rel="noreferrer">去 GitHub 评论</a>
        </footer>
      </aside>
    </div>
  </dialog>

  <script type="module" src="app.js"></script>
</body>
</html>

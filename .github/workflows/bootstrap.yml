name: Bootstrap gallery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
      - "scripts/bootstrap.mjs"
      - "scripts/sync-discussions.mjs"
      - "scripts/build-thumbnails.mjs"
      - "scripts/thumbnail-utils.mjs"
      - "scripts/restore-thumbnail-snapshot.sh"
      - "scripts/publish-thumbnail-snapshot.sh"
      - "gallery.config.json"
      - "package.json"
  workflow_dispatch:

permissions:
  contents: write
  discussions: write
  issues: write

concurrency:
  group: gallery-content-sync
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install image tooling
        run: npm install --no-audit --no-fund

      - name: Test parsers and helpers
        run: npm test

      - name: Create labels and sample discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/bootstrap.mjs

      - name: Synchronize all approved discussions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-discussions.mjs --full

      - name: Restore and build thumbnail snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THUMBNAIL_DIR: ${{ runner.temp }}/open-wallpaper-thumbnails
          THUMBNAIL_BRANCH: thumbnails
        shell: bash
        run: |
          bash scripts/restore-thumbnail-snapshot.sh "$THUMBNAIL_DIR"
          node scripts/build-thumbnails.mjs "$THUMBNAIL_DIR"

      - name: Commit generated post data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THUMBNAIL_DIR: ${{ runner.temp }}/open-wallpaper-thumbnails
          THUMBNAIL_BRANCH: thumbnails
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add data/posts
            if git diff --cached --quiet; then
              echo "No post data changed."
              break
            fi
            git commit -m "chore: bootstrap gallery data"
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "Unable to push synchronized data." >&2
              exit 1
            fi

            echo "Push raced with another workflow; rebuilding from latest main (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            node scripts/sync-discussions.mjs --full
            bash scripts/restore-thumbnail-snapshot.sh "$THUMBNAIL_DIR"
            node scripts/build-thumbnails.mjs "$THUMBNAIL_DIR"
            sleep $((attempt * 2))
          done

      - name: Publish history-free thumbnail branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          THUMBNAIL_DIR: ${{ runner.temp }}/open-wallpaper-thumbnails
          THUMBNAIL_BRANCH: thumbnails
        run: bash scripts/publish-thumbnail-snapshot.sh "$THUMBNAIL_DIR"

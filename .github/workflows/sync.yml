name: Sync discussions

on:
  discussion:
    types: [created, edited, deleted, labeled, unlabeled, category_changed]
  discussion_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: "23 19 * * *"
  workflow_dispatch:
    inputs:
      full:
        description: "执行全量重建"
        type: boolean
        default: true

permissions:
  contents: write
  discussions: read

concurrency:
  group: gallery-content-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install image tooling
        run: npm install --no-audit --no-fund

      - name: Test parsers and helpers
        run: npm test

      - name: Resolve event details
        shell: bash
        run: |
          set -euo pipefail
          number="$(jq -r '.discussion.number // .comment.discussion.number // 0' "$GITHUB_EVENT_PATH")"
          force_full=false
          deleted=false
          if [[ "$GITHUB_EVENT_NAME" == "schedule" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            force_full=true
          fi
          if [[ "$GITHUB_EVENT_NAME" == "discussion" && "$(jq -r '.action // ""' "$GITHUB_EVENT_PATH")" == "deleted" ]]; then
            deleted=true
          fi
          echo "DISCUSSION_NUMBER=$number" >> "$GITHUB_ENV"
          echo "DISCUSSION_DELETED=$deleted" >> "$GITHUB_ENV"
          echo "FORCE_FULL=$force_full" >> "$GITHUB_ENV"
          echo "THUMBNAIL_DIR=$RUNNER_TEMP/open-wallpaper-thumbnails" >> "$GITHUB_ENV"
          echo "THUMBNAIL_BRANCH=thumbnails" >> "$GITHUB_ENV"

      - name: Synchronize changed Discussion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$FORCE_FULL" == "true" ]]; then
            node scripts/sync-discussions.mjs --full
          elif [[ "$DISCUSSION_DELETED" == "true" ]]; then
            node scripts/sync-discussions.mjs --deleted
          else
            node scripts/sync-discussions.mjs
          fi

      - name: Restore and build thumbnail snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          bash scripts/restore-thumbnail-snapshot.sh "$THUMBNAIL_DIR"
          node scripts/build-thumbnails.mjs "$THUMBNAIL_DIR"

      - name: Commit synchronized data with retry
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for attempt in 1 2 3 4 5; do
            git add data/posts
            if git diff --cached --quiet; then
              echo "Gallery data is already current."
              break
            fi

            git commit -m "chore: sync discussion data"
            if git push origin HEAD:main; then
              break
            fi

            if [[ "$attempt" == "5" ]]; then
              echo "Unable to commit synchronized Discussion data." >&2
              exit 1
            fi

            echo "Push raced with another change; rebuilding from current main (attempt $attempt)."
            git fetch origin main
            git reset --hard origin/main
            if [[ "$FORCE_FULL" == "true" ]]; then
              node scripts/sync-discussions.mjs --full
            elif [[ "$DISCUSSION_DELETED" == "true" ]]; then
              node scripts/sync-discussions.mjs --deleted
            else
              node scripts/sync-discussions.mjs
            fi
            bash scripts/restore-thumbnail-snapshot.sh "$THUMBNAIL_DIR"
            node scripts/build-thumbnails.mjs "$THUMBNAIL_DIR"
            sleep $((attempt * 2))
          done

      - name: Publish history-free thumbnail branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-thumbnail-snapshot.sh "$THUMBNAIL_DIR"

name: Pull request checks

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Run unit tests
        run: npm test

      - name: Check scripts
        shell: bash
        run: |
          node --check scripts/build-thumbnails.mjs
          node --check scripts/sync-discussions.mjs
          node --check site/app.js
          bash -n scripts/restore-thumbnail-snapshot.sh
          bash -n scripts/publish-thumbnail-snapshot.sh

      - name: Build static site
        run: npm run build

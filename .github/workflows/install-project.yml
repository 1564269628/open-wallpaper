name: Install project bundle

on:
  push:
    branches: [main]
    paths:
      - ".install/**"
      - ".github/workflows/install-project.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check bundle
        id: bundle
        shell: bash
        run: |
          if [[ -f .install/part-00 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract project
        if: steps.bundle.outputs.exists == 'true'
        shell: bash
        run: |
          cat .install/part-* | base64 -d > /tmp/open-wallpaper.tar.gz
          tar -xzf /tmp/open-wallpaper.tar.gz
          rm -rf .install

      - name: Set up Node.js
        if: steps.bundle.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test and build
        if: steps.bundle.outputs.exists == 'true'
        run: |
          npm test
          npm run build

      - name: Commit project
        if: steps.bundle.outputs.exists == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: build GitHub Discussions wallpaper gallery"
          git push origin HEAD:main
